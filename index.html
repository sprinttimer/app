<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- キャッシュ完全無効化ヘッダー -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Sprint Timer Pro</title>
    <!-- パラメータ付与で強制更新 -->
    <link rel="manifest" href="manifest.json?v=20260827">
    <meta name="theme-color" content="#111">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            color: #333;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #1a1a1a;
            color: #fff;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        .tab-menu {
            display: flex;
            overflow-x: auto;
            background-color: #222;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }
        .tab-btn {
            flex: 0 0 auto;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #aaa;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
        }
        .tab-btn.active {
            color: #fff;
            border-bottom: 3px solid #28a745;
            background-color: #111;
        }

        #main-container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        .video-container {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            margin-bottom: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            user-select: none;
        }
        video, canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        canvas.overlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .mode-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .badge-live { background-color: #e2e3e5; color: #383d41; }
        .badge-rec { background-color: #f8d7da; color: #721c24; animation: blink 1s infinite; }
        .badge-play { background-color: #d1ecf1; color: #0c5460; }

        @keyframes blink { 50% { opacity: 0.5; } }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .data-card {
            background-color: #fff;
            border-radius: 10px;
            padding: 12px 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .data-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .data-value {
            font-size: 22px;
            font-weight: bold;
            color: #111;
        }
        .unit {
            font-size: 13px;
            margin-left: 2px;
            color: #666;
            font-weight: normal;
        }

        .settings-card {
            background-color: #fff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: left;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .settings-card h3 {
            margin-top: 0;
            font-size: 16px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .setting-item {
            margin-bottom: 15px;
        }
        .setting-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .setting-value {
            color: #007bff;
            font-size: 15px;
        }
        input[type="range"] {
            width: 100%;
            margin: 5px 0;
        }
        input[type="number"], select {
            width: 80px;
            padding: 6px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: center;
        }

        button.action-btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-bottom: 10px;
        }
        button.action-btn:active {
            transform: scale(0.98);
        }
        .btn-green { background-color: #28a745; color: white; }
        .btn-blue { background-color: #007bff; color: white; }
        .btn-red { background-color: #dc3545; color: white; }
        .btn-gray { background-color: #6c757d; color: white; }

        .annotation-box {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;
            text-align: center;
        }

        /* MyJump コマ送りコントローラー */
        .frame-control-box {
            background: #fff;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .frame-btn-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }
        .frame-btn {
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid #ccc;
            background: #f8f9fa;
            border-radius: 6px;
            cursor: pointer;
        }
        .frame-btn:active { background: #e2e6ea; }
        .point-tag {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            color: #fff;
        }
        .tag-takeoff { background-color: #dc3545; }
        .tag-landing { background-color: #007bff; }

        /* バージョン確認用バー */
        .version-info {
            font-size: 11px;
            color: #888;
            margin-top: 20px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<header>Sprint Timer Pro</header>

<div class="tab-menu">
    <button class="tab-btn" onclick="switchTab('sound-only')">SD</button>
    <button class="tab-btn active" onclick="switchTab('myjump')">MyJump</button>
    <button class="tab-btn" onclick="switchTab('settings')">設定</button>
</div>

<div id="main-container">

    <!-- MyJump（CMJ & RSI） -->
    <div id="tab-myjump" class="tab-content active">
        <div class="annotation-box">
            注釈: 正面を向いて撮影すること<br>
            <span style="color:#dc3545; font-weight:bold;">※空中では足を曲げないこと（離地と着地の姿勢を揃える）</span>
        </div>

        <div id="jump-mode-indicator" class="mode-badge badge-live">● ライブビュー（位置合わせ用）</div>

        <div class="video-container">
            <!-- ライブ表示用と録画再生用を分離してフリーズ防止 -->
            <video id="jump-live-video" autoplay playsinline muted style="display: block; pointer-events:none;"></video>
            <video id="jump-play-video" playsinline style="display: none;" controls></video>
        </div>
        
        <button class="action-btn btn-gray" style="padding:10px; font-size:14px; margin-bottom:12px;" onclick="toggleCameraFacing('myjump')">📷 カメラ切り替え (イン / アウト)</button>
        
        <!-- コマ送り＆手動指定コントローラー -->
        <div class="frame-control-box">
            <div style="font-size:13px; font-weight:bold; margin-bottom:4px;">録画動画の確認・コマ指定</div>
            <div style="font-size:12px; color:#666;" id="jump-frame-status">現在の再生位置: 0.000s</div>
            
            <div class="frame-btn-group">
                <button class="frame-btn" style="background:#e0a800; color:#fff; border:none;" onclick="playRecordedVideo()">▶ 動画再生</button>
                <button class="frame-btn" style="background:#6c757d; color:#fff; border:none;" onclick="pauseRecordedVideo()">❚❚ 一時停止</button>
            </div>

            <div class="frame-btn-group">
                <button class="frame-btn" onclick="stepJumpVideo(-0.033)">-1コマ</button>
                <button class="frame-btn" onclick="stepJumpVideo(0.033)">+1コマ</button>
            </div>
            
            <div class="frame-btn-group" style="margin-top:10px;">
                <button class="frame-btn" style="background:#f8d7da; border-color:#f5c6cb; color:#721c24;" onclick="setJumpPoint('takeoff')">① 離地（Take-off）指定</button>
                <button class="frame-btn" style="background:#cce5ff; border-color:#b8daff; color:#004085;" onclick="setJumpPoint('landing')">② 接地（Landing）指定</button>
            </div>
            <div style="font-size:12px; margin-top:8px; display:flex; justify-content:space-around;">
                <span>離地: <span id="val-takeoff-time" class="point-tag tag-takeoff">未指定</span></span>
                <span>接地: <span id="val-landing-time" class="point-tag tag-landing">未指定</span></span>
            </div>
        </div>

        <div class="results-grid">
            <div class="data-card">
                <div class="data-label">ジャンプ高</div>
                <div class="data-value" id="jump-height">0.0 <span class="unit">cm</span></div>
            </div>
            <div class="data-card">
                <div class="data-label">滞空時間 (Flight)</div>
                <div class="data-value" id="jump-ft">0.000 <span class="unit">s</span></div>
            </div>
        </div>
        <button class="action-btn btn-green" id="jump-start-btn" onclick="toggleJumpMeasurement()">録画開始</button>
        <button class="action-btn btn-gray" style="padding:8px; font-size:13px;" onclick="resetJumpToLiveMode()">ライブカメラ表示に戻す</button>
    </div>

    <!-- 画面更新確認用バージョン表記 -->
    <div class="version-info" id="app-version-display">【バージョン: v2.0.1 (最新)】</div>

</div>

<script>
    // --- 強制キャッシュクリア＆SW解除ロジック ---
    (function clearSystemCaches() {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                for (let registration of registrations) {
                    registration.unregister(); // 古いSWを削除
                }
            });
        }
        if ('caches' in window) {
            caches.keys().then(names => {
                for (let name of names) caches.delete(name); // キャッシュストレージクリア
            });
        }
    })();

    // --- カメラストリーム制御 ---
    let currentStream = null;
    let cameraFacing = 'user';

    async function startCamera() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
            currentStream = null;
        }

        const constraints = {
            video: { facingMode: { ideal: cameraFacing }, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
        };

        try {
            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            const liveVideoEl = document.getElementById('jump-live-video');
            if (liveVideoEl) {
                liveVideoEl.srcObject = currentStream;
                liveVideoEl.muted = true;
                await liveVideoEl.play().catch(e => console.log(e));
            }
        } catch (err) {
            alert("カメラ起動に失敗しました: " + err.message);
        }
    }

    function toggleCameraFacing() {
        cameraFacing = cameraFacing === 'user' ? 'environment' : 'user';
        startCamera();
    }

    // --- MyJump 録画＆再生切替ロジック ---
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordedVideoUrl = null;
    let isRecordingJump = false;

    function toggleJumpMeasurement() {
        const btn = document.getElementById('jump-start-btn');
        const indicator = document.getElementById('jump-mode-indicator');
        const liveVideo = document.getElementById('jump-live-video');
        const playVideo = document.getElementById('jump-play-video');

        if (!isRecordingJump) {
            // 【録画開始】
            if (!currentStream) { alert("カメラを準備中..."); return; }

            // 表示をライブカメラ画面に確実にする
            liveVideo.style.display = 'block';
            playVideo.style.display = 'none';

            recordedChunks = [];
            const options = MediaRecorder.isTypeSupported('video/mp4') ? { mimeType: 'video/mp4' } : { mimeType: 'video/webm' };
            
            try {
                mediaRecorder = new MediaRecorder(currentStream, options);
            } catch (e) {
                mediaRecorder = new MediaRecorder(currentStream);
            }

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/mp4' });
                if (recordedVideoUrl) URL.revokeObjectURL(recordedVideoUrl);
                recordedVideoUrl = URL.createObjectURL(blob);
                
                // 録画完了後、再生用ビデオに切替
                playVideo.src = recordedVideoUrl;
                playVideo.load();
                
                liveVideo.style.display = 'none';
                playVideo.style.display = 'block';
            };

            mediaRecorder.start();
            isRecordingJump = true;

            btn.innerText = "録画停止（コマ指定画面へ）";
            btn.className = "action-btn btn-red";
            indicator.innerText = "● 録画中...（カメラ作動中）";
            indicator.className = "mode-badge badge-rec";

        } else {
            // 【録画停止】
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            isRecordingJump = false;

            btn.innerText = "録画開始";
            btn.className = "action-btn btn-green";
            indicator.innerText = "✓ 録画完了（コマ送り確認可能）";
            indicator.className = "mode-badge badge-play";
        }
    }

    function resetJumpToLiveMode() {
        const liveVideo = document.getElementById('jump-live-video');
        const playVideo = document.getElementById('jump-play-video');
        const indicator = document.getElementById('jump-mode-indicator');

        playVideo.pause();
        playVideo.style.display = 'none';
        liveVideo.style.display = 'block';

        indicator.innerText = "● ライブビュー（位置合わせ用）";
        indicator.className = "mode-badge badge-live";
        startCamera();
    }

    // --- 動画再生＆コマ送り操作 ---
    function playRecordedVideo() {
        const playVideo = document.getElementById('jump-play-video');
        if (recordedVideoUrl) playVideo.play();
    }

    function pauseRecordedVideo() {
        const playVideo = document.getElementById('jump-play-video');
        playVideo.pause();
    }

    function stepJumpVideo(seconds) {
        const playVideo = document.getElementById('jump-play-video');
        if (recordedVideoUrl) {
            playVideo.pause();
            playVideo.currentTime = Math.max(0, Math.min(playVideo.duration || 0, playVideo.currentTime + seconds));
        }
    }

    const playVideoEl = document.getElementById('jump-play-video');
    playVideoEl.addEventListener('timeupdate', () => {
        document.getElementById('jump-frame-status').innerText = "現在の再生位置: " + playVideoEl.currentTime.toFixed(3) + "s";
    });

    // --- 計算ロジック ---
    let jumpTakeoffTime = null;
    let jumpLandingTime = null;

    function setJumpPoint(type) {
        const playVideo = document.getElementById('jump-play-video');
        if (!recordedVideoUrl) { alert("先に録画を行ってください。"); return; }

        const currentTime = playVideo.currentTime;
        if (type === 'takeoff') {
            jumpTakeoffTime = currentTime;
            document.getElementById('val-takeoff-time').innerText = currentTime.toFixed(3) + "s";
        } else if (type === 'landing') {
            jumpLandingTime = currentTime;
            document.getElementById('val-landing-time').innerText = currentTime.toFixed(3) + "s";
        }

        if (jumpTakeoffTime !== null && jumpLandingTime !== null) {
            if (jumpLandingTime <= jumpTakeoffTime) {
                alert("接地時間は離地時間より後ろ（大きい値）を指定してください。");
                return;
            }
            const flightTime = jumpLandingTime - jumpTakeoffTime;
            const heightCm = (1 / 8) * 9.80665 * Math.pow(flightTime, 2) * 100;

            document.getElementById('jump-ft').innerHTML = flightTime.toFixed(3) + ' <span class="unit">s</span>';
            document.getElementById('jump-height').innerHTML = heightCm.toFixed(1) + ' <span class="unit">cm</span>';
        }
    }

    // 初期起動
    startCamera();
</script>
</body>
</html>
