<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sprint Timer Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#222">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #222;
            color: #fff;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
        }
        #main-container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .data-card {
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .data-label {
            font-size: 14px;
            color: #777;
            margin-bottom: 5px;
        }
        .data-value {
            font-size: 32px;
            font-weight: bold;
            color: #222;
        }
        .unit {
            font-size: 18px;
            margin-left: 5px;
            color: #555;
        }
        #video-container {
            position: relative;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        video, canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-bottom: 10px;
        }
        button:active {
            transform: scale(0.98);
        }
        #start-session-btn {
            background-color: #28a745;
            color: white;
        }
        #start-session-btn:disabled {
            background-color: #ccc;
        }
        #view-history-btn {
            background-color: #007bff;
            color: white;
        }
        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #888;
            padding-bottom: 20px;
        }

        /* 飛び出し瞬間（1回目）のみ赤い線で強調するためのスタイル */
        .detected-frame {
            border: 4px solid red;
        }
    </style>
</head>
<body>

<header>Sprint Timer Pro</header>

<div id="main-container">

    <div id="video-container">
        <video id="input-video" playsinline></video>
        <canvas id="output-canvas"></canvas>
    </div>

    <div class="data-card">
        <div class="data-label">リアクションタイム</div>
        <div class="data-value" id="reaction-time-display">0.000 <span class="unit">s</span></div>
    </div>

    <div class="data-card">
        <div class="data-label">飛び出し角度</div>
        <div class="data-value" id="start-angle-display">0.0 <span class="unit">°</span></div>
    </div>

    <button id="start-session-btn">計測を開始 (10回無料)</button>
    <button id="view-history-btn" onclick="alert('履歴機能は開発中です')">計測履歴を表示</button>

    <footer>STORES連携・無制限解除はメニューへ</footer>

</div>

<!-- MediaPipe required scripts -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

<script>
    const videoElement = document.getElementById('input-video');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const reactionTimeDisplay = document.getElementById('reaction-time-display');
    const startAngleDisplay = document.getElementById('start-angle-display');
    const startSessionBtn = document.getElementById('start-session-btn');
    const videoContainer = document.getElementById('video-container');

    let startTime = null;
    let sprintDetected = false;
    let detectionAngle = null;
    let lastDetectionTime = 0;
    const cooldownMs = 1500; // 連続検知防止（1.5秒）

    // 計測回数管理 (10回お試し用)
    let sessionCount = parseInt(localStorage.getItem('sessionCount')) || 0;
    updateButtonText();

    // 音声読み込み
    const beepSound = new Audio('https://www.soundjay.com/buttons/sounds/beep-01a.mp3');

    // MediaPipe Pose 設定
    const pose = new Pose({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
    }});
    pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        enableSegmentation: false,
        smoothSegmentation: false,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
    });
    pose.onResults(onResults);

    // カメラ設定
    const camera = new Camera(videoElement, {
        onFrame: async () => {
            await pose.send({image: videoElement});
        },
        width: 1280,
        height: 720,
        facingMode: 'environment' // 背面カメラを使用
    });

    // 角度計算関数 (2点の座標から角度を算出)
    function calculateAngle(p1, p2) {
        const radians = Math.atan2(p2.y - p1.y, p2.x - p1.x);
        let angle = Math.abs(radians * 180.0 / Math.PI);
        
        // 角度の基準調整（日本人が馴染みやすい「地面からの角度」にする）
        // 肩(p1)から腰(p2)を結ぶ線を想定
        angle = 180 - angle; 
        
        return angle;
    }

    // MediaPipe の解析結果処理
    function onResults(results) {
        if (!results.poseLandmarks) return;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        
        // 解析用の映像とキャンバスのサイズを合わせる
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;

        // 骨格を描画 (オプションで非表示も可)
        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#ffffffaa', lineWidth: 1});
        drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#ffffffaa', lineWidth: 0.5, radius: 1});

        // 計測中で、まだ検知していない場合のみ判定
        if (startTime && !sprintDetected) {
            const currentTime = Date.now();
            
            // 肩（左または右の平均）と腰（左または右の平均）の座標を取得
            const leftShoulder = results.poseLandmarks[11];
            const rightShoulder = results.poseLandmarks[12];
            const leftHip = results.poseLandmarks[23];
            const rightHip = results.poseLandmarks[24];

            // 両方の肩と腰が検知できている場合
            if ((leftShoulder.visibility > 0.6 && leftHip.visibility > 0.6) || 
                (rightShoulder.visibility > 0.6 && rightHip.visibility > 0.6)) {
                
                // 代表点として、右肩と右腰の角度を採用 (左右どちらかに統一可能)
                // この2点を結ぶ線（体幹軸）の角度を計算
                const shoulder = rightShoulder.visibility > 0.6 ? rightShoulder : leftShoulder;
                const hip = rightHip.visibility > 0.6 ? rightHip : leftHip;
                
                // 角度を計算（地面からの立ち上がり角度）
                const currentAngle = calculateAngle(shoulder, hip);

                // --- 飛び出し検知ロジック ---
                // 「クラウチング構え（低い角度）」から「飛び出し（急激な角度上昇）」を検知
                // このコードでは、角度が45度を超えた瞬間を「飛び出し」と判定
                // (競技者や用途に合わせて調整可能。例: 55度)
                if (currentAngle > 45 && (currentTime - lastDetectionTime > cooldownMs)) {
                    sprintDetected = true;
                    lastDetectionTime = currentTime;
                    detectionAngle = currentAngle;

                    // リアクションタイム（ミリ秒）
                    const reactionTimeMs = currentTime - startTime;
                    // **MS（ミリ秒）から「秒」に変換して表記 (小数点3桁まで)**
                    const reactionTimeSec = (reactionTimeMs / 1000).toFixed(3);
                    
                    reactionTimeDisplay.innerHTML = `${reactionTimeSec} <span class="unit">s</span>`;
                    startAngleDisplay.innerHTML = `${currentAngle.toFixed(1)} <span class="unit">°</span>`;

                    // 飛び出し瞬間（1回目）のみ画面全体を赤い枠で囲んで強調
                    videoContainer.classList.add('detected-frame');
                    setTimeout(() => {
                        videoContainer.classList.remove('detected-frame');
                    }, 500); // 0.5秒間赤い枠を表示
                }
            }
        }
        canvasCtx.restore();
    }

    // 計測ボタンの処理
    startSessionBtn.addEventListener('click', () => {
        if (sessionCount >= 10) {
            alert('無料試用回数(10回)を超えました。STORES連携から無制限版をご購入ください。');
            return;
        }

        startTime = null;
        sprintDetected = false;
        detectionAngle = null;
        videoContainer.classList.remove('detected-frame');
        reactionTimeDisplay.innerHTML = '0.000 <span class="unit">s</span>';
        startAngleDisplay.innerHTML = '0.0 <span class="unit">°</span>';
        startSessionBtn.disabled = true;

        // 音声を鳴らす (ピピピ音)
        let count = 0;
        const intervalId = setInterval(() => {
            beepSound.play();
            count++;
            if (count === 3) {
                clearInterval(intervalId);
                // 3回目の音の後に、1〜2.5秒のランダムな待ち時間を設定して計測開始
                const startDelay = Math.floor(Math.random() * 1500) + 1000;
                startSessionBtn.innerText = '準備...';
                setTimeout(() => {
                    // 計測開始音 (高いピ！)
                    beepSound.pitch = 2.0; // 音程を少し高く
                    beepSound.play();
                    startTime = Date.now();
                    startSessionBtn.innerText = 'Go! (検知中)';
                    beepSound.pitch = 1.0; // 音程を戻す

                    // 計測回数をカウント
                    sessionCount++;
                    localStorage.setItem('sessionCount', sessionCount);
                    updateButtonText();
                }, startDelay);
            }
        }, 600);
    });

    // カメラの起動
    camera.start().catch((err) => {
        alert('カメラの起動に失敗しました。カメラへのアクセスを許可してください。');
        console.error(err);
    });

    // PWA用のService Worker登録
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('sw.js').then(function(registration) {
                console.log('ServiceWorker registration successful with scope: ', registration.scope);
            }, function(err) {
                console.log('ServiceWorker registration failed: ', err);
            });
        });
    }

    function updateButtonText() {
        startSessionBtn.innerText = `計測を開始 (${sessionCount}/10回お試し)`;
        if (sessionCount >= 10) {
            startSessionBtn.style.backgroundColor = "#ccc";
            startSessionBtn.style.cursor = "not-allowed";
        }
    }
</script>

</body>
</html>
